<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capture Sandbox</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&family=Open+Sans:wght@700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  body { font-family: 'Roboto', sans-serif; max-width: 640px; margin: 4rem auto; padding: 0 1rem; background: #111; color: #eee; }
  h1 { font-family: 'Open Sans', sans-serif; font-size: 1.6rem; }
  .card { background: #1c1c1c; border: 1px solid #333; border-radius: 10px; padding: 1rem 1.25rem; margin: 1rem 0; }
  footer { color: #777; font-size: .85rem; margin-top: 3rem; }
</style>
</head>
<body>
<h1>🧪 Capture Sandbox</h1>
<p>Lease smoke test.</p>
<p>This site exists to watch the capture loop run end-to-end:</p>
<div class="card">
  <strong>idea spoken into Discord</strong> → typed router → GitHub issue here →
  agent PR → merge → this page updates within a minute.
</div>
<p id="current-date"></p>
<p id="fun-greeting"></p>
<p id="changes">No agent-made changes yet.</p>
<footer>Deployed from <code>main</code> by the capture VM's pull timer.</footer>
<script>
  // Function to get a fun greeting
  function getFunGreeting() {
    const greetings = [
      "Hello, world!",
      "Greetings, earthling!",
      "Hi there!",
      "Welcome!",
      "Hey there, friend!",
      "Salutations!",
      "What's up?"
    ];
    const randomIndex = Math.floor(Math.random() * greetings.length);
    return greetings[randomIndex];
  }

  // Update the current date and fun greeting
  document.getElementById('current-date').textContent = new Date().toLocaleDateString();
  document.getElementById('fun-greeting').textContent = getFunGreeting();
</script>
</body>
</html>
